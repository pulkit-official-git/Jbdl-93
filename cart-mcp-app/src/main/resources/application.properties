spring.application.name=cart-mcp-app
server.port=9090

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/cartdb?createDatabaseIfNotExist=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:oooooooo}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Pure Java MCP server (Spring AI + MCP Java SDK)
spring.ai.mcp.server.enabled=true
spring.ai.mcp.server.name=cart-mcp-server
spring.ai.mcp.server.version=1.0.0
spring.ai.mcp.server.type=SYNC
spring.ai.mcp.server.protocol=STREAMABLE
spring.ai.mcp.server.instructions=Manage product catalog and shopping cart using the available tools.


