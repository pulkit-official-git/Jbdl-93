syntax = "proto3";

option java_multiple_files = true;
option java_package = "com.example.notif.grpc";
option java_outer_classname = "NotifProto";

package notif;

service NotifService {
  rpc NotifyOrder (OrderNotification) returns (NotifyResponse);
}

message OrderNotification {
  string order_id = 1;
  string customer_name = 2;
  string product_name = 3;
  int32 quantity = 4;
  double amount = 5;
}

message NotifyResponse {
  bool success = 1;
  string message = 2;
}
